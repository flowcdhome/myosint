[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myosint"
version = "0.1.2"
description = "Мини OSINT-инструмент"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "packaging>=23.0",
    "dnspython>=2.4",
]

[project.scripts]
myosint = "myosint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
